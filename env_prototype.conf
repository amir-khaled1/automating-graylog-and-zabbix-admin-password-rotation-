
#when adding a graylog server, make sure that it has its id added into the GRAYLOG_SERVERS_IDS
#when adding a graylog server keep the same naming convention in all the server properties 
#GRAYLOG_RSIADMIN_PWD_(id of the server)
#GRAYLOG_ROOT_PWD_(id of the server)
#GRAYLOG_SERVER_IP_(id of the server)
#when deleting a server make sure to delete its id from servers_ids (graylog, zabbix) list 
##################
# Graylog
##################
GRAYLOG_CONFIG_FILE_PATH="/etc/graylog/server/server.conf"
GRAYLOG_SERVERS_IDS="1 2"
# Graylog 1
GRAYLOG_RSIADMIN_PWD_1=""
GRAYLOG_ROOT_PWD_1=""
GRAYLOG_SERVER_IP_1=""
GRAYLOG_LOGFILENAME_1="path/to/logfile1"
# Graylog 2
GRAYLOG_RSIADMIN_PWD_2=""
GRAYLOG_ROOT_PWD_2=""
GRAYLOG_SERVER_IP_2=""
GRAYLOG_LOGFILENAME_2="path/to/logfile2"
################
# ZABBIX 
################
#when adding a zabbix server keep the same naming convention in all server properties 
#ZABBIX_RSIADMIN_PWD_(id of the server)
#ZABBIX_ROOT_PWD_(id of the server)
#ZABBIX_SERVER_IP_(id of the server)
#ZABBIX_MYSQL_ROOT_PWD_(id of the server)
ZABBIX_SERVERS_IDS="1 2 3"
#Zabbix 1 
ZABBIX_RSIADMIN_PWD_1=""
ZABBIX_ROOT_PWD_1=""
ZABBIX_SERVER_IP_1=""
ZABBIX_MYSQL_ROOT_PWD_1=""
ZABBIX_LOGFILENAME_1="path/to/logfile1"
#Zabbix 2 
ZABBIX_RSIADMIN_PWD_2=""
ZABBIX_ROOT_PWD_2=""
ZABBIX_SERVER_IP_2=""
ZABBIX_MYSQL_ROOT_PWD_2=""
ZABBIX_LOGFILENAME_2="path/to/logfile2"

